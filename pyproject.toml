[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-is-there-any-deal"
version = "0.1.0"
description = "An MCP server for checking PC game deals and keeping a local wishlist, using IsThereAnyDeal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mir Khan" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "claude", "isthereanydeal", "game-deals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "mcp[cli]>=2.3,<3",
    "aiohttp",
    "aiosqlite",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/Mir-Khan/mcp-is-there-any-deal"

[project.scripts]
mcp-is-there-any-deal = "deals_mcp.server:main"
mcp-is-there-any-deal-alerts = "deals_mcp.alerts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
